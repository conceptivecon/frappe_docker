name: erpnext-hspdiamonds

x-erpnext-image: &erpnext_image
  image: frappe/erpnext:v15

x-bench-volumes: &bench_volumes
  - /home/erpnext/apps:/home/frappe/frappe-bench/apps
  - /home/erpnext/sites:/home/frappe/frappe-bench/sites
  - /home/erpnext/logs:/home/frappe/frappe-bench/logs
  - /home/erpnext/assets:/home/frappe/frappe-bench/sites/assets
  - /home/erpnext/.ssh:/home/frappe/.ssh:ro

services:
  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-innodb-read-only-compressed
      - --max-allowed-packet=64M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - /home/erpnext/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: ${RESTART_POLICY:-always}

  redis-cache:
    image: redis:6.2-alpine
    command: redis-server --save "" --appendonly no
    volumes:
      - /home/erpnext/redis:/data
    restart: ${RESTART_POLICY:-always}

  redis-queue:
    image: redis:6.2-alpine
    command: redis-server --save "" --appendonly no
    volumes:
      - /home/erpnext/redis:/data
    restart: ${RESTART_POLICY:-always}

  redis-socketio:
    image: redis:6.2-alpine
    command: redis-server --save "" --appendonly no
    volumes:
      - /home/erpnext/redis:/data
    restart: ${RESTART_POLICY:-always}

  configurator:
    <<: *erpnext_image
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      redis-socketio:
        condition: service_started
    entrypoint: ["bash", "-lc"]
    command: >
      ls -1 apps > sites/apps.txt &&
      bench set-config -g db_host "${DB_HOST}" &&
      bench set-config -gp db_port "${DB_PORT}" &&
      bench set-config -g redis_cache "redis://${REDIS_CACHE}" &&
      bench set-config -g redis_queue "redis://${REDIS_QUEUE}" &&
      bench set-config -g redis_socketio "redis://${REDIS_SOCKETIO}" &&
      bench set-config -gp socketio_port 9000
    environment:
      TZ: ${TZ}
    volumes: *bench_volumes
    restart: on-failure

  create-site:
    <<: *erpnext_image
    depends_on:
      configurator:
        condition: service_completed_successfully
    entrypoint: ["bash", "-lc"]
    command: >
      if [ ! -d "sites/${SITE_NAME}" ]; then
        bench new-site "${SITE_NAME}" --mariadb-root-password "${MYSQL_ROOT_PASSWORD}" --admin-password "${ADMIN_PASSWORD}" --db-name "${DB_NAME}" &&
        bench --site "${SITE_NAME}" install-app erpnext &&
        bench --site "${SITE_NAME}" install-app india_compliance &&
        bench --site "${SITE_NAME}" install-app india_payments &&
        bench --site "${SITE_NAME}" install-app "${CUSTOM_APP_NAME}" &&
        bench --site "${SITE_NAME}" set-config host_name "https://${SITE_NAME}";
      else
        echo "Site ${SITE_NAME} already exists; skipping create-site.";
      fi
    environment:
      TZ: ${TZ}
    volumes: *bench_volumes

  backend:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
    volumes: *bench_volumes
    restart: ${RESTART_POLICY:-always}

  queue-short:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    command: bench worker --queue short,default
    environment:
      TZ: ${TZ}
    volumes: *bench_volumes
    restart: ${RESTART_POLICY:-always}

  queue-long:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    command: bench worker --queue long,default,short
    environment:
      TZ: ${TZ}
    volumes: *bench_volumes
    restart: ${RESTART_POLICY:-always}

  scheduler:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    command: bench schedule
    environment:
      TZ: ${TZ}
    volumes: *bench_volumes
    restart: ${RESTART_POLICY:-always}

  websocket:
    <<: *erpnext_image
    depends_on:
      create-site:
        condition: service_completed_successfully
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      TZ: ${TZ}
    volumes: *bench_volumes
    restart: ${RESTART_POLICY:-always}

  frontend:
    <<: *erpnext_image
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    command: ["nginx-entrypoint.sh"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: off
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
      TZ: ${TZ}
    volumes:
      - /home/erpnext/sites:/home/frappe/frappe-bench/sites
      - /home/erpnext/assets:/home/frappe/frappe-bench/sites/assets
    restart: ${RESTART_POLICY:-always}
