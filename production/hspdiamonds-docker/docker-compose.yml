name: erpnext-hspdiamonds

x-backend-image: &backend_image
  image: ${CUSTOM_IMAGE}:${CUSTOM_TAG}

x-backend-common: &backend_common
  <<: *backend_image
  restart: unless-stopped
  working_dir: /home/frappe/frappe-bench
  env_file:
    - .env
  environment:
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    REDIS_CACHE: ${REDIS_CACHE}
    REDIS_QUEUE: ${REDIS_QUEUE}
    REDIS_SOCKETIO: ${REDIS_SOCKETIO}
    SOCKETIO_PORT: ${SOCKETIO_PORT}
    FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
  volumes:
    - /home/erpnext/apps:/home/frappe/frappe-bench/apps
    - /home/erpnext/sites:/home/frappe/frappe-bench/sites
    - /home/erpnext/logs:/home/frappe/frappe-bench/logs
    - /home/erpnext/config/logrotate.conf:/etc/logrotate.d/frappe:ro
    - /home/erpnext/.ssh:/home/frappe/.ssh:ro

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: ["mysqld", "--defaults-file=/etc/mysql/conf.d/mariadb.cnf"]
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - /home/erpnext/mariadb:/var/lib/mysql
      - /home/erpnext/config/mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - /home/erpnext/redis-cache:/data
      - /home/erpnext/config/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - /home/erpnext/redis-queue:/data
      - /home/erpnext/config/redis-queue.conf:/usr/local/etc/redis/redis.conf:ro

  redis-socketio:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - /home/erpnext/redis-socketio:/data

  backend:
    <<: *backend_common
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      redis-socketio:
        condition: service_started
    command: >
      bash -lc "gunicorn --chdir /home/frappe/frappe-bench/sites
      --bind 0.0.0.0:8000
      --threads 4
      --workers ${GUNICORN_WORKERS}
      --worker-class gthread
      --worker-tmp-dir /dev/shm
      --timeout 120
      --preload frappe.app:application"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/method/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s

  websocket:
    <<: *backend_common
    depends_on:
      backend:
        condition: service_healthy
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    ports:
      - "9001:9001"

  worker-short:
    <<: *backend_common
    depends_on:
      backend:
        condition: service_healthy
    command: ["bench", "worker", "--queue", "short,default"]

  worker-long:
    <<: *backend_common
    depends_on:
      backend:
        condition: service_healthy
    command: ["bench", "worker", "--queue", "long,default"]

  scheduler:
    <<: *backend_common
    depends_on:
      backend:
        condition: service_healthy
    command: ["bench", "schedule"]
