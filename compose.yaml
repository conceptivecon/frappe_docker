x-bench-volumes: &bench_volumes
  - /home/erpnext/sites:/home/frappe/frappe-bench/sites
  - /home/erpnext/logs:/home/frappe/frappe-bench/logs
  - /home/erpnext/apps:/home/frappe/frappe-bench/apps
  - /home/erpnext/assets:/home/frappe/frappe-bench/sites/assets
  - /home/erpnext/.ssh:/home/frappe/.ssh:ro

services:
  app-bootstrap:
    image: alpine/git:2.47.2
    container_name: app-bootstrap
    restart: "no"
    entrypoint:
      - sh
      - -ec
    command: >
      mkdir -p /apps;
      if [ ! -d /apps/frappe/.git ]; then git clone --depth 1 --branch version-15 https://github.com/frappe/frappe.git /apps/frappe; fi;
      if [ ! -d /apps/erpnext/.git ]; then git clone --depth 1 --branch version-15 https://github.com/frappe/erpnext.git /apps/erpnext; fi;
      if [ ! -d /apps/india-compliance/.git ]; then git clone --depth 1 --branch version-15 https://github.com/resilient-tech/india-compliance.git /apps/india-compliance; fi;
      echo "app-bootstrap completed";
    volumes:
      - /home/erpnext/apps:/apps

  db:
    image: mariadb:10.6
    container_name: db
    restart: ${RESTART_POLICY:-unless-stopped}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-admin}}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-admin}}
    volumes:
      - /home/erpnext/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=${DB_ROOT_PASSWORD:-${DB_PASSWORD:-admin}}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:6.2-alpine
    container_name: redis-cache
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /home/erpnext/redis:/data

  redis-queue:
    image: redis:6.2-alpine
    container_name: redis-queue
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /home/erpnext/redis:/data

  redis-socketio:
    image: redis:6.2-alpine
    container_name: redis-socketio
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - /home/erpnext/redis:/data

  configurator:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:v15
    pull_policy: ${PULL_POLICY:-always}
    restart: "no"
    platform: linux/amd64
    container_name: configurator
    volumes: *bench_volumes
    entrypoint:
      - bash
      - -c
    command:
      - >
        set -e;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_SOCKETIO";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        echo "configurator completed";
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      REDIS_SOCKETIO: redis-socketio:6379
      SOCKETIO_PORT: 9000
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      redis-socketio:
        condition: service_started
  backend:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:v15
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      configurator:
        condition: service_completed_successfully
    platform: linux/amd64
    container_name: backend
    volumes: *bench_volumes

  frontend:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:v15
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    platform: linux/amd64
    container_name: frontend
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-erp.hspdiamonds.com}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes: *bench_volumes
    depends_on:
      - backend
      - websocket
    ports:
      - "127.0.0.1:${HTTP_PUBLISH_PORT:-8080}:8080"

  websocket:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:v15
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      configurator:
        condition: service_completed_successfully
    platform: linux/amd64
    container_name: websocket
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes: *bench_volumes

  queue-short:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:v15
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      configurator:
        condition: service_completed_successfully
    platform: linux/amd64
    container_name: queue-short
    volumes: *bench_volumes
    command: bench worker --queue short,default

  queue-long:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:v15
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      configurator:
        condition: service_completed_successfully
    platform: linux/amd64
    container_name: queue-long
    volumes: *bench_volumes
    command: bench worker --queue long,default,short

  scheduler:
    image: ${CUSTOM_IMAGE:-frappe/erpnext}:v15
    pull_policy: ${PULL_POLICY:-always}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      configurator:
        condition: service_completed_successfully
    platform: linux/amd64
    container_name: scheduler
    volumes: *bench_volumes
    command: bench schedule
